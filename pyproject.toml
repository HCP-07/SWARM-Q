[project]
name = "swarm-q"
version = "1.0.0"
description = "Adaptive Decentralized QPSO (AD-QPSO) multi-agent swarm coordination"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "pandas>=2.0,<4",
    "pillow>=9,<13",
    "pyyaml>=6,<7",
    "fastapi>=0.100,<1",
    "uvicorn>=0.24,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "interrogate>=1.7.0",
    "mypy>=1.9.0",
    "bandit>=1.7.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
